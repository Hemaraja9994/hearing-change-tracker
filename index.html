<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearing Change Tracker</title>
<meta name="description" content="A one-minute monthly check-in for older adults and families that notices when everyday hearing may be changing.">
<meta name="theme-color" content="#17212E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
.wrap{max-width:880px}
body{font-size:1.06rem}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q p{margin:0 0 8px;font-weight:700}
.q .seg button{padding:9px 16px;font-size:.95rem}
.status{font-size:1.2rem;font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="icon.svg" width="34" height="34" alt=""><h1><span data-i18n="appName"></span><small data-i18n="appSub"></small></h1></div>
  <div class="top-tools"><span class="net" id="net" role="status" aria-live="polite"></span><label class="sr" for="lang" data-i18n="language">Language</label><select id="lang" class="lang"></select></div>
</div></header>

<main class="wrap">
  <section class="intro"><h2 data-i18n="h2"></h2><p data-i18n="intro"></p></section>

  <section class="panel" style="margin-top:18px" aria-labelledby="sTitle"><h3 id="sTitle" data-i18n="statusTitle"></h3><div id="status" aria-live="polite"></div></section>

  <section class="panel" style="margin-top:18px" aria-labelledby="cTitle">
    <h3 id="cTitle" data-i18n="checkTitle"></h3>
    <p class="lead" data-i18n="checkIntro"></p>
    <div id="qs"></div>
    <div class="row2">
      <label class="field" for="tv"><span data-i18n="tvVol"></span><span class="hint" data-i18n="tvHint"></span><input type="number" id="tv" min="0" max="100" inputmode="numeric"></label>
      <label class="field" for="who"><span data-i18n="who"></span><select id="who"></select></label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="actions"><button type="button" class="primary" id="save" data-i18n="save"></button></div>
  </section>

  <section class="panel" style="margin-top:18px" aria-labelledby="hTitle">
    <div class="head-row"><h3 id="hTitle" data-i18n="histTitle"></h3><div class="actions" style="margin-top:0"><button type="button" class="small" id="csv">CSV</button></div></div>
    <div id="chart"></div><div class="table-scroll" id="hist" style="margin-top:10px"></div>
  </section>

  <section class="callout" style="margin-top:18px"><h4 data-i18n="testTitle"></h4><p style="margin:0" data-i18n="testText"></p>
    <p style="margin:8px 0 0"><a href="https://www.who.int/teams/noncommunicable-diseases/sensory-functions-disability-and-rehabilitation/hearwho" target="_blank" rel="noopener">hearWHO (WHO)</a></p></section>
</main>

<footer><div class="wrap">
  <p data-i18n="disclaimer"></p>
  <p data-i18n="reviewNote"></p>
  <p id="credit"></p>
</div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    first:"ट्रैकिंग शुरू करने के लिए पहली जाँच सहेजें। अगले महीने फिर आएँ।", stable:"शुरुआती जाँचों से कोई साफ़ बदलाव नहीं।", change:"आपके जवाब बताते हैं कि सुनना कम हो रहा हो सकता है। कृपया श्रवण जाँच कराएँ।", high:"आपके जवाब सुनने में कठिनाई की ओर इशारा करते हैं। कृपया श्रवण जाँच कराएँ।",
    testTitle:"श्रवण जाँच कराएँ", testText:"RCI-पंजीकृत ऑडियोलॉजिस्ट ठीक से जाँच कर सकते हैं। WHO का मुफ़्त hearWHO ऐप भी जल्दी श्रवण जाँच देता है।",
    disclaimer:"यह श्रवण जाँच नहीं है। ये सवाल इस ऐप के लिए लिखे गए हैं और प्रमाणित नहीं हैं। एक कान में अचानक सुनाई कम होना आपात स्थिति है: उसी दिन डॉक्टर से मिलें।" }
};
const KEY = "hct-log";
let log = store.get(KEY, []), ans = {};
function status(){
  if (!log.length) return {k:"first", c:"info"};
  const sorted = log.slice().sort((a,b)=>a.date.localeCompare(b.date)), last = sorted[sorted.length-1];
  const base = sorted.slice(0, Math.min(3, sorted.length - 1));
  if (last.score >= 7) return {k:"high", c:"high"};
  if (base.length){ const b = base.reduce((s,x)=>s+x.score,0)/base.length, bt = base.filter(x=>x.tv!=null);
    const tvUp = bt.length && last.tv != null && last.tv - bt.reduce((s,x)=>s+x.tv,0)/bt.length >= 3;
    if (last.score - b >= 3 || tvUp) return {k:"change", c:"mid"}; }
  return {k: sorted.length < 2 ? "first" : "stable", c: sorted.length < 2 ? "info" : "ok"};
}
function render(){
  $("#who").innerHTML = `<option value="self">${esc(t("self"))}</option><option value="family">${esc(t("family"))}</option>`;
  $("#qs").innerHTML = QS.map((q,i) => `<div class="q"><p>${esc(pick(q))}</p><div class="seg" role="group" aria-label="${esc(pick(q))}">${[["never",0],["sometimes",1],["often",2]].map(([k,v]) => `<button type="button" data-q="${i}" data-v="${v}" aria-pressed="${ans[i]===v}">${esc(t(k))}</button>`).join("")}</div></div>`).join("");
  const s = status();
  $("#status").innerHTML = `<p class="status"><span class="pill ${s.c}">${s.c==="high"||s.c==="mid"?"!":"✓"}</span> ${esc(t(s.k))}</p>`;
  const sorted = log.slice().sort((a,b)=>a.date.localeCompare(b.date));
  $("#chart").innerHTML = sorted.length >= 2 ? lineChart([{label:t("score"), color:"var(--accent)", points:sorted.map(x=>({x:new Date(x.date+"T12:00"), y:x.score}))}, ...(sorted.some(x=>x.tv!=null) ? [{label:t("tv"), color:"var(--mid)", points:sorted.filter(x=>x.tv!=null).map(x=>({x:new Date(x.date+"T12:00"), y:x.tv}))}] : [])], {yMin:0}) : "";
  $("#hist").innerHTML = sorted.length ? `<table class="rec"><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("score"))} (0–12)</th><th>${esc(t("tv"))}</th><th></th></tr></thead><tbody>${sorted.slice().reverse().map(x => `<tr><td>${esc(fmtDate(x.date))}</td><td class="num">${x.score}</td><td class="num">${x.tv ?? "–"}</td><td><button type="button" class="small danger" data-del="${x.id}">✕</button></td></tr>`).join("")}</tbody></table>` : "";
}
$("#qs").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (!b) return; ans[b.dataset.q] = Number(b.dataset.v); render(); });
$("#save").addEventListener("click", () => {
  if (Object.keys(ans).length < QS.length){ $("#err").textContent = t("need"); return; } $("#err").textContent = "";
  const tv = $("#tv").value === "" ? null : Number($("#tv").value);
  log.push({id:uid(), date:todayISO(), score:Object.values(ans).reduce((s,v)=>s+v,0), answers:{...ans}, tv, who:$("#who").value});
  store.set(KEY, log); ans = {}; $("#tv").value = ""; render(); toast(t("saved"));
});
$("#hist").addEventListener("click", e => { if (!e.target.dataset.del) return; log = log.filter(x => x.id !== e.target.dataset.del); store.set(KEY, log); render(); });
$("#csv").addEventListener("click", () => downloadCSV([["date","score_0_12","tv_volume","answered_by",...QS.map((q,i)=>"q"+(i+1))], ...log.map(x => [x.date,x.score,x.tv??"",x.who,...QS.map((q,i)=>x.answers[i])])], `hearing-change-${todayISO()}.csv`));
KIT.start({ i18n: I18N_APP, render, version: "0.1.0" });
</script>
</body>
</html>
